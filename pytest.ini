; Test configuration.
;
; Part of the verification harness. pytest.ini takes precedence over
; pyproject.toml, so do not add a [tool.pytest.ini_options] section there.

[pytest]
testpaths = tests
addopts = --strict-markers --strict-config -ra
xfail_strict = True

markers =
    gui: requires a Qt runtime; runs under QT_QPA_PLATFORM=offscreen
    kirigami: requires distribution-packaged Kirigami 6; desktop tier only
    integration: exercises the filesystem or subprocesses under a temporary XDG root
    slow: takes more than a second
