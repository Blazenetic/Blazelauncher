name: Bug report
description: Report reproducible incorrect or unsafe behaviour
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal paths or private launcher environment values.
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Blazelauncher version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Distribution, desktop and session
      placeholder: CachyOS; KDE Plasma 6.x; Wayland
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitised logs or screenshots
      description: Remove tokens, home-directory names, environment values and private commands.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have not attached private executables, secrets or unredacted environment values.
          required: true
