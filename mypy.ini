; Type-checking configuration.
;
; Part of the verification harness. mypy.ini takes precedence over
; pyproject.toml, so do not add a [tool.mypy] section there.

[mypy]
python_version = 3.12
; `src` joins this list in Phase 0, when the package exists. Until then a bare
; `mypy` would fail on the missing directory; scripts/verify.sh passes both
; paths explicitly as soon as src/blazelauncher is present.
files = tests
strict = True
warn_unreachable = True
warn_unused_configs = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
pretty = True

; The QML/Qt boundary is dynamically typed at the edges. Keep the relaxation
; narrow and never extend it to domain or application code.
[mypy-blazelauncher.qml.*]
ignore_errors = True

[mypy-PySide6.*]
ignore_missing_imports = True
